plugins {
  id "java"
  id "application"
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.telegram:telegrambots:6.8.0'
  implementation 'org.slf4j:slf4j-simple:2.0.7'
  implementation 'io.github.cdimascio:dotenv-java:3.0.0'
}

application {
  mainClass = "com.example.bot.Main"
}